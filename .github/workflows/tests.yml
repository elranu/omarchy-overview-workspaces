name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  menu-index:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs: a tag can be moved to other code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # MenuIndex.js is plain JS with no dependencies, so there is nothing to
      # install. The fixtures live in tests/, so Omarchy is not needed either.
      - run: node --test
